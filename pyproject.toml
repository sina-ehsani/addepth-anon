[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "addepth"
version = "0.1.0"
description = "Positional per-position depth routing for recurrent spatio-temporal forecasters"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.2",
    "numpy>=1.24",
    "h5py>=3.9",
    "tqdm>=4.65",
    "matplotlib>=3.7",
    "wandb>=0.16",
    "pandas>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov",
]
